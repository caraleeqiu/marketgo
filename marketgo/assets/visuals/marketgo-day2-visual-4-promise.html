<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marketgo Day 2 - The Promise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 1200px;
            height: 675px;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            position: relative;
        }

        .title {
            font-size: 56px;
            font-weight: 900;
            color: #a5b4fc;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 36px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 60px;
        }

        .weeks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        .week {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(165, 180, 252, 0.3);
            border-radius: 16px;
            padding: 30px;
        }

        .week-title {
            font-size: 28px;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 15px;
        }

        .week-desc {
            font-size: 20px;
            color: #d1d5db;
            line-height: 1.5;
        }

        .cta {
            margin-top: 50px;
            text-align: center;
        }

        .cta-text {
            font-size: 32px;
            font-weight: 700;
            color: #10b981;
        }

        .watermark {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 18px;
            color: #6366f1;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🎯 MARKETGO</div>
        <div class="subtitle">30-DAY PLAN</div>

        <div class="weeks">
            <div class="week">
                <div class="week-title">Week 1:</div>
                <div class="week-desc">Build audience<br>(500-1000 followers)</div>
            </div>

            <div class="week">
                <div class="week-title">Week 2:</div>
                <div class="week-desc">Share progress<br>(get feedback)</div>
            </div>

            <div class="week">
                <div class="week-title">Week 3:</div>
                <div class="week-desc">Beta testing<br>(find early users)</div>
            </div>

            <div class="week">
                <div class="week-title">Week 4:</div>
                <div class="week-desc">Launch<br>(Product Hunt ready)</div>
            </div>
        </div>

        <div class="cta">
            <div class="cta-text">No guessing. Just execute.</div>
        </div>

        <div class="watermark">marketgo</div>
    </div>
</body>
</html>
