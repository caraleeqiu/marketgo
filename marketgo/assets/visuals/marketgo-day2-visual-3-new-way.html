<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marketgo Day 2 - The New Way</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 1200px;
            height: 675px;
            background: linear-gradient(135deg, #0f2f1f 0%, #1a4d2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px;
            position: relative;
        }

        .title {
            font-size: 64px;
            font-weight: 900;
            color: #10b981;
            margin-bottom: 60px;
            letter-spacing: 2px;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 800px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .icon {
            font-size: 48px;
            min-width: 60px;
        }

        .step-content {
            flex: 1;
        }

        .step-title {
            font-size: 36px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 8px;
        }

        .step-desc {
            font-size: 24px;
            color: #d1d5db;
        }

        .result {
            margin-top: 60px;
            padding: 30px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid #10b981;
            border-radius: 12px;
            text-align: center;
        }

        .result-label {
            font-size: 28px;
            color: #d1d5db;
            margin-bottom: 15px;
        }

        .result-text {
            font-size: 48px;
            font-weight: 900;
            color: #10b981;
        }

        .watermark {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 18px;
            color: #4b5563;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">✅ THE NEW WAY ✅</div>

        <div class="timeline">
            <div class="step">
                <div class="icon">📢</div>
                <div class="step-content">
                    <div class="step-title">Day 1:</div>
                    <div class="step-desc">Announce idea</div>
                </div>
            </div>

            <div class="step">
                <div class="icon">🔨</div>
                <div class="step-content">
                    <div class="step-title">Day 1-30:</div>
                    <div class="step-desc">Build + Market simultaneously</div>
                </div>
            </div>

            <div class="step">
                <div class="icon">🎉</div>
                <div class="step-content">
                    <div class="step-title">Day 30:</div>
                    <div class="step-desc">Launch to warm audience</div>
                </div>
            </div>
        </div>

        <div class="result">
            <div class="result-label">Result:</div>
            <div class="result-text">Users before launch</div>
        </div>

        <div class="watermark">marketgo</div>
    </div>
</body>
</html>
