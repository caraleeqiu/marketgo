<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marketgo Day 2 - Before/After</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 1200px;
            height: 675px;
            display: flex;
            overflow: hidden;
            border-radius: 0;
        }

        .side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
        }

        .left {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b1b 100%);
            border-right: 4px solid #333;
        }

        .right {
            background: linear-gradient(135deg, #0f2f1f 0%, #1a4d2e 100%);
        }

        .label {
            position: absolute;
            top: 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            opacity: 0.6;
        }

        .left .label {
            color: #ef4444;
        }

        .right .label {
            color: #10b981;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 72px;
            font-weight: 900;
            margin-bottom: 10px;
            line-height: 1;
        }

        .left .stat-number {
            color: #ef4444;
        }

        .right .stat-number {
            color: #10b981;
        }

        .stat-label {
            font-size: 24px;
            font-weight: 600;
            color: #f3f4f6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .emoji {
            font-size: 120px;
            margin-top: 20px;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            color: #9ca3af;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="side left">
            <div class="label">THE OLD WAY</div>

            <div class="content">
                <div class="stat">
                    <div class="stat-number">6 MONTHS</div>
                    <div class="stat-label">Building</div>
                </div>

                <div class="stat">
                    <div class="stat-number">23</div>
                    <div class="stat-label">Upvotes</div>
                </div>

                <div class="stat">
                    <div class="stat-number">0</div>
                    <div class="stat-label">Customers</div>
                </div>

                <div class="emoji">😞</div>
            </div>

            <div class="footer">BUILD IN SECRET</div>
        </div>

        <div class="side right">
            <div class="label">THE NEW WAY</div>

            <div class="content">
                <div class="stat">
                    <div class="stat-number">30 DAYS</div>
                    <div class="stat-label">Marketing</div>
                </div>

                <div class="stat">
                    <div class="stat-number">500+</div>
                    <div class="stat-label">Followers</div>
                </div>

                <div class="stat">
                    <div class="stat-number">50</div>
                    <div class="stat-label">Beta Users</div>
                </div>

                <div class="emoji">✨</div>
            </div>

            <div class="footer">BUILD IN PUBLIC</div>
        </div>
    </div>
</body>
</html>
