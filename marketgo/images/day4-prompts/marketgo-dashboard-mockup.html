<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0F172A;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px;
}
.dashboard {
  width: 1200px;
  background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
  border-radius: 24px;
  padding: 60px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
h1 {
  color: #F1F5F9;
  font-size: 36px;
  margin-bottom: 40px;
  font-weight: 700;
}
.week-section {
  background: #1E293B;
  border-radius: 16px;
  padding: 30px;
  margin-bottom: 30px;
  border: 1px solid #334155;
}
.week-title {
  color: #94A3B8;
  font-size: 14px;
  margin-bottom: 20px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.posts {
  display: flex;
  gap: 20px;
}
.post-card {
  flex: 1;
  background: linear-gradient(135deg, #7C3AED 0%, #3B82F6 100%);
  border-radius: 12px;
  padding: 20px;
  color: white;
}
.day {
  font-size: 12px;
  opacity: 0.9;
  margin-bottom: 8px;
}
.post-title {
  font-size: 16px;
  font-weight: 600;
}
.timeline {
  background: #1E293B;
  border-radius: 16px;
  padding: 30px;
  margin-bottom: 30px;
  border: 1px solid #334155;
}
.timeline-bar {
  height: 12px;
  background: #334155;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 15px;
}
.timeline-fill {
  width: 70%;
  height: 100%;
  background: linear-gradient(90deg, #7C3AED 0%, #3B82F6 100%);
}
.create-btn {
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  color: white;
  font-size: 18px;
  font-weight: 600;
  padding: 20px 40px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  width: 100%;
  transition: transform 0.2s;
}
.create-btn:hover {
  transform: translateY(-2px);
}
.tagline {
  text-align: center;
  color: #7C3AED;
  font-size: 24px;
  font-weight: 700;
  margin-top: 40px;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="dashboard">
  <h1>marketgo Dashboard</h1>

  <div class="week-section">
    <div class="week-title">This Week (3 posts scheduled)</div>
    <div class="posts">
      <div class="post-card">
        <div class="day">Monday 10:00 AM</div>
        <div class="post-title">Week 1 Progress Update</div>
      </div>
      <div class="post-card">
        <div class="day">Wednesday 10:00 AM</div>
        <div class="post-title">Feature Sneak Peek</div>
      </div>
      <div class="post-card">
        <div class="day">Friday 10:00 AM</div>
        <div class="post-title">Dashboard Reveal</div>
      </div>
    </div>
  </div>

  <div class="timeline">
    <div class="week-title">Next 30 Days - Auto-scheduled</div>
    <div class="timeline-bar">
      <div class="timeline-fill"></div>
    </div>
  </div>

  <button class="create-btn">+ Create New Content</button>

  <div class="tagline">Clean. Simple. No BS.</div>
</div>
</body>
</html>
