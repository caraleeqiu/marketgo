<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 880" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7785"/>
    </marker>
    <marker id="ahL" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ff8c42"/>
    </marker>
  </defs>

  <!-- ===== 输入层分叉 ===== -->
  <text x="20" y="24" fill="#9aa6b2" font-size="12" letter-spacing="1">输入层分叉 · 照片摄入</text>

  <rect x="330" y="34" width="320" height="44" rx="9" fill="#1f2733" stroke="#2a313c"/>
  <text x="490" y="55" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">师傅上传照片 + 一句话描述</text>
  <text x="490" y="71" fill="#9aa6b2" font-size="11" text-anchor="middle">开场已前置告知拍摄须知（近/清/亮/单/带环境/真实）</text>

  <line x1="490" y1="78" x2="490" y2="100" stroke="#6b7785" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="290" y="102" width="400" height="38" rx="9" fill="#1f2733" stroke="#2a313c"/>
  <text x="490" y="126" fill="#d6dde6" font-size="12.5" text-anchor="middle">VLM triage 四问：真照片? · scene_type? · 单一主体? · 够清?</text>

  <!-- fan to 4 branches -->
  <line x1="490" y1="140" x2="142" y2="168" stroke="#6b7785" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="490" y1="140" x2="374" y2="168" stroke="#6b7785" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="490" y1="140" x2="606" y2="168" stroke="#6b7785" stroke-width="1.3" marker-end="url(#ah)"/>
  <line x1="490" y1="140" x2="838" y2="168" stroke="#6b7785" stroke-width="1.3" marker-end="url(#ah)"/>

  <!-- 4 branch boxes -->
  <rect x="32" y="170" width="220" height="58" rx="9" fill="#15251b" stroke="#2f6b41"/>
  <text x="142" y="192" fill="#7fd99a" font-size="13" font-weight="600" text-anchor="middle">① PASS 可诊断</text>
  <text x="142" y="210" fill="#9aa6b2" font-size="10.5" text-anchor="middle">记 subject_location</text>
  <text x="142" y="223" fill="#9aa6b2" font-size="10.5" text-anchor="middle">→ 进主干</text>

  <rect x="264" y="170" width="220" height="58" rx="9" fill="#2a2118" stroke="#7a5a2e"/>
  <text x="374" y="192" fill="#e0b070" font-size="13" font-weight="600" text-anchor="middle">② RESHOOT 补拍</text>
  <text x="374" y="210" fill="#9aa6b2" font-size="10.5" text-anchor="middle">太远/糊/暗 → 指出缺哪条</text>
  <text x="374" y="223" fill="#9aa6b2" font-size="10.5" text-anchor="middle">请师傅补拍</text>

  <rect x="496" y="170" width="220" height="58" rx="9" fill="#2a2118" stroke="#7a5a2e"/>
  <text x="606" y="192" fill="#e0b070" font-size="13" font-weight="600" text-anchor="middle">③ DISAMBIGUATE 指认</text>
  <text x="606" y="210" fill="#9aa6b2" font-size="10.5" text-anchor="middle">多个区域 → 师傅选/裁切</text>
  <text x="606" y="223" fill="#9aa6b2" font-size="10.5" text-anchor="middle">到要讲的那个</text>

  <rect x="728" y="170" width="220" height="58" rx="9" fill="#2a1a1a" stroke="#7a3535"/>
  <text x="838" y="192" fill="#e08a8a" font-size="13" font-weight="600" text-anchor="middle">④ REJECT 硬拒绝</text>
  <text x="838" y="210" fill="#9aa6b2" font-size="10.5" text-anchor="middle">图纸/网图/AI图/无主体</text>
  <text x="838" y="223" fill="#9aa6b2" font-size="10.5" text-anchor="middle">+ 说明原因</text>

  <!-- loop back ②③④ -->
  <path d="M 838 228 L 838 250 L 968 250 L 968 56 L 654 56" fill="none" stroke="#ff8c42" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ahL)"/>
  <path d="M 374 228 L 374 244 L 606 244 L 606 232" fill="none" stroke="#ff8c42" stroke-width="1.2" stroke-dasharray="5 3"/>
  <path d="M 606 244 L 838 244" fill="none" stroke="#ff8c42" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="930" y="160" fill="#ff8c42" font-size="11" text-anchor="middle">②③④ 回环重传</text>
  <text x="930" y="174" fill="#ff8c42" font-size="11" text-anchor="middle">→ 重新 triage</text>

  <!-- PASS into trunk -->
  <line x1="142" y1="228" x2="142" y2="286" stroke="#6b7785" stroke-width="1.5"/>
  <line x1="142" y1="286" x2="220" y2="286" stroke="#6b7785" stroke-width="1.5"/>
  <line x1="220" y1="286" x2="220" y2="316" stroke="#6b7785" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="150" y="280" fill="#7fd99a" font-size="10.5">所有路径收束到 PASS → 汇入 diagnosis_plan</text>

  <!-- ===== 主干 5 Phase ===== -->
  <text x="20" y="312" fill="#9aa6b2" font-size="12" letter-spacing="1">主干 · 5 Phase / 5 Artifact（每 Phase 必有师傅确认 gate，无 Phase 自动往下走）</text>

  <rect x="40" y="320" width="900" height="438" rx="12" fill="none" stroke="#3a4250" stroke-dasharray="6 4"/>

  <!-- Phase 01 -->
  <rect x="170" y="338" width="560" height="76" rx="9" fill="#1c2433" stroke="#3a4658"/>
  <text x="186" y="360" fill="#fff" font-size="13.5" font-weight="600">Phase 01 · 诊断绑定</text>
  <text x="186" y="378" fill="#9aa6b2" font-size="11">4 子门：照片 triage · 诊断+问题点 · 衰变预测 · 声线　+ 整体确认</text>
  <text x="186" y="396" fill="#9aa6b2" font-size="11">师傅是事实源 · agent 提候选；预测不联网当结论搜</text>
  <rect x="186" y="402" width="200" height="6" rx="3" fill="#243042"/>
  <rect x="600" y="350" width="118" height="22" rx="11" fill="#15263a" stroke="#2e4d6e"/>
  <text x="659" y="365" fill="#7fb5e0" font-size="11" text-anchor="middle">diagnosis_plan</text>
  <text x="659" y="392" fill="#6b7785" font-size="10" text-anchor="middle">draft → verified</text>

  <line x1="450" y1="414" x2="450" y2="432" stroke="#6b7785" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Phase 02 -->
  <rect x="170" y="434" width="560" height="50" rx="9" fill="#1c2433" stroke="#3a4658"/>
  <text x="186" y="455" fill="#fff" font-size="13.5" font-weight="600">Phase 02 · 旁白脚本</text>
  <text x="186" y="473" fill="#9aa6b2" font-size="11">5 镜头节拍 · 反套路+短句 · 零维修操作指令　+ 整体确认</text>
  <rect x="568" y="447" width="150" height="22" rx="11" fill="#15263a" stroke="#2e4d6e"/>
  <text x="643" y="462" fill="#7fb5e0" font-size="11" text-anchor="middle">narration_script</text>

  <line x1="450" y1="484" x2="450" y2="502" stroke="#6b7785" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Phase 03 -->
  <rect x="170" y="504" width="560" height="50" rx="9" fill="#1c2433" stroke="#3a4658"/>
  <text x="186" y="525" fill="#fff" font-size="13.5" font-weight="600">Phase 03 · 旁白配音</text>
  <text x="186" y="543" fill="#9aa6b2" font-size="11">克隆师傅声线 + TTS + ASR 吐 SRT　+ 师傅试听 gate</text>
  <rect x="612" y="517" width="106" height="22" rx="11" fill="#15263a" stroke="#2e4d6e"/>
  <text x="665" y="532" fill="#7fb5e0" font-size="11" text-anchor="middle">voiceover</text>

  <line x1="450" y1="554" x2="450" y2="572" stroke="#6b7785" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Phase 04 -->
  <rect x="170" y="574" width="560" height="88" rx="9" fill="#1c2433" stroke="#3a4658"/>
  <text x="186" y="595" fill="#fff" font-size="13.5" font-weight="600">Phase 04 · 分镜生成（5 镜头 SRT-anchored）</text>
  <text x="186" y="613" fill="#9aa6b2" font-size="11">批次A 切 5 镜 → Gate 1</text>
  <text x="186" y="630" fill="#9aa6b2" font-size="11">批次B prep（X-ray 关键帧 inline 子门 · 搜实参考→生成信息图）→ Gate 2</text>
  <text x="186" y="647" fill="#9aa6b2" font-size="11">批次C 生成+后处理（remotion 为主 · i2v 为辅）→ Gate 3</text>
  <rect x="606" y="586" width="112" height="22" rx="11" fill="#15263a" stroke="#2e4d6e"/>
  <text x="662" y="601" fill="#7fb5e0" font-size="11" text-anchor="middle">storyboard</text>

  <line x1="450" y1="662" x2="450" y2="680" stroke="#6b7785" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Phase 05 -->
  <rect x="170" y="682" width="560" height="50" rx="9" fill="#1c2433" stroke="#3a4658"/>
  <text x="186" y="703" fill="#fff" font-size="13.5" font-weight="600">Phase 05 · 合成出片</text>
  <text x="186" y="721" fill="#9aa6b2" font-size="11">拼接 + 字幕 + 音频（BGM/SFX）　可选层拍板 + promote 前确认</text>
  <rect x="650" y="695" width="68" height="22" rx="11" fill="#1a2e1c" stroke="#2f6b41"/>
  <text x="684" y="710" fill="#7fd99a" font-size="11" text-anchor="middle">final</text>

  <!-- confirmation loop on the right -->
  <path d="M 730 460 L 760 460 L 760 700 L 730 700" fill="none" stroke="#ff8c42" stroke-width="1.3" stroke-dasharray="5 3"/>
  <path d="M 760 376 L 760 440 M 730 376 L 760 376" fill="none" stroke="#ff8c42" stroke-width="1.3" stroke-dasharray="5 3"/>
  <line x1="760" y1="440" x2="760" y2="462" stroke="#ff8c42" stroke-width="0"/>
  <path d="M 760 700 L 760 760 L 110 760 L 110 376 L 168 376" fill="none" stroke="#ff8c42" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ahL)"/>
  <text x="775" y="540" fill="#ff8c42" font-size="11">不满意</text>
  <text x="775" y="555" fill="#ff8c42" font-size="11">→ 回对应</text>
  <text x="775" y="570" fill="#ff8c42" font-size="11">Phase 重做</text>
  <text x="775" y="585" fill="#ff8c42" font-size="11">（循环，</text>
  <text x="775" y="600" fill="#ff8c42" font-size="11">不分叉）</text>

  <line x1="450" y1="758" x2="450" y2="784" stroke="#6b7785" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- ===== 交付 ===== -->
  <rect x="210" y="786" width="560" height="64" rx="11" fill="#1a2e1c" stroke="#2f6b41"/>
  <text x="490" y="810" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">交付完成 · 9:16 竖版诊断科普视频 · ≤75s</text>
  <text x="490" y="832" fill="#9aa6b2" font-size="11" text-anchor="middle">5 镜头：标注 → X光剖视 → 衰变推演 → 修复图解 → 师傅署名卡</text>
  <text x="490" y="845" fill="#7fd99a" font-size="10" text-anchor="middle">真照片做 Shot 1/4 锚点 · AI 只画相机拍不到的（统一动画信息图视觉语言）</text>
</svg>
